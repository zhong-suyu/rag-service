services:
  api:
    build: .
    image: rag-service:local
    ports:
      - "8000:8000"          # 宿主机 8000 → 容器 8000
    env_file:
      - .env                 # 密钥在运行时注入，不写进镜像
    volumes:
      - ./logs:/app/logs     # 日志挂到宿主机，容器删了日志还在
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要建向量库（约 3~5 分钟），宽限期留足，避免被误判成启动失败
      start_period: 300s
